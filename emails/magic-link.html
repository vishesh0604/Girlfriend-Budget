<!--
  Supabase → Authentication → Emails → Templates → "Magic Link"
  Paste this whole file as the template body. Source of truth lives here.
  Used by the app's "Forgot password" flow (signInWithOtp).
  Variables: {{ .Token }} (6-digit code), {{ .ConfirmationURL }} (link).
  Logo loads from https://girlfriendbudget.vercel.app/icon.png — update
  that URL if the deployment domain changes.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
  </head>
  <body style="margin:0; padding:0; background-color:#e5f6ff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e5f6ff;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px; width:100%;">
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td><img src="https://girlfriendbudget.vercel.app/icon.png" width="40" height="40" alt="Her Penny" style="display:block; border-radius:11px;" /></td>
                    <td style="padding-left:10px; font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; color:#26354d;">Her Penny</td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="background-color:#ffdce9; border:1px solid #f3b9cd; border-radius:20px; padding:32px 28px;">
                <p style="margin:0 0 6px 0; font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700; color:#26354d;">Your one-time code</p>
                <p style="margin:0 0 24px 0; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:22px; color:#647086;">Enter this code to continue. It expires in an hour.</p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" style="background-color:#f8fcff; border:1px solid #c9ddea; border-radius:14px; padding:16px 8px; font-family:'Courier New',Courier,monospace; font-size:26px; font-weight:700; letter-spacing:6px; white-space:nowrap; color:#26354d;">{{ .Token }}</td>
                  </tr>
                </table>

                <p style="margin:24px 0 12px 0; font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:20px; color:#647086;">Or continue with one tap:</p>

                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background-color:#4f8fbd; border-radius:12px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:11px 22px; font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none;">Continue</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:20px 4px 0 4px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#8a94a6;">
                If you didn&rsquo;t request this, you can safely ignore this email &mdash; your account stays as it is.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
